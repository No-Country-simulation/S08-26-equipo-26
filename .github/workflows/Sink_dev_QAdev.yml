name: Manual Sync to QA Repo

on:
  workflow_dispatch:

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Development Repo (Dev Branch Only)
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Push to QA Repository (Dev Branch Only)
        env:
          QA_TOKEN: ${{ secrets.QA_REPO_TOKEN }} 
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Double check this line carefully:
          git remote add qa "https://x-access-token:${QA_TOKEN}@://github.com"
          
          git push qa dev:dev --force
