name: Manual Sync to QA Repo

on:
  workflow_dispatch: # This will now be visible on all branches

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Development Repo (Dev Branch Only)
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Push to QA Repository (Dev Branch Only)
        env:
          QA_TOKEN: ${{ secrets.QA_REPO_TOKEN }} 
        run: |
          # Safety check to see if the token is actually loading
          if [ -z "$QA_TOKEN" ]; then
            echo "ERROR: QA_REPO_TOKEN secret is empty or missing in GitHub Settings!"
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Wrapped in quotes to prevent token breakdown
          git remote add qa "https://x-access-token:${QA_TOKEN}@://github.com"
          
          git push qa dev:dev --force
