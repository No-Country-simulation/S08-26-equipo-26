name: Manual Sync to QA Repo

on:
  workflow_dispatch:

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Development Repo
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Push to QA Repository
        env:
          QA_TOKEN: ${{ secrets.QA_REPO_TOKEN }} 
        run: |
          if [ -z "$QA_TOKEN" ]; then
            echo "ERROR: QA_REPO_TOKEN secret is empty or missing!"
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # HERE IS THE MISSING LINE (Line 25):
          git remote add qa "https://x-access-token:${QA_TOKEN}@://github.com"
          
          git push qa dev:dev --force
